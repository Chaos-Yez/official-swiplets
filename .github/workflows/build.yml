name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: Release the current nightly as a stable version
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release && 'release' || 'build' }}
  cancel-in-progress: ${{ !inputs.release }}

jobs:
  build:
    name: Build
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install
      - name: Check
        run: bun run check
      - name: Set versions
        id: version
        run: |-
          source .github/github.sh
          PREVIOUS=$(git tag -l --format='%(contents:subject)' nightly)
          BUILD_NUMBER=$((PREVIOUS + 1))
          echo "build_number=$BUILD_NUMBER"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          TARGET=$(retry gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" --jq .target_commitish || true)
          FEED=
          if [ -n "$TARGET" ]; then
            FEED=$(curl -fsSL --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/swiplets.json")
          fi
          for directory in $(jq -r '.workspaces[]' package.json); do
            ID=$(jq -r '.swiplet.id // empty' "$directory/package.json")
            if [ -z "$ID" ]; then
              continue
            fi
            CODE=$BUILD_NUMBER
            if [ -n "$FEED" ] && git diff --quiet "$TARGET" HEAD -- "$directory" package.json bun.lock; then
              CODE=$(jq --arg id "$ID" --argjson code "$CODE" 'first(.swiplets[] | select(.id == $id) | .versionCode) // $code' <<< "$FEED")
            fi
            echo "$ID versionCode=$CODE"
            jq --argjson code "$CODE" '.version += "-nightly" | .swiplet.versionCode = $code' "$directory/package.json" > "$RUNNER_TEMP/package.json"
            mv "$RUNNER_TEMP/package.json" "$directory/package.json"
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build
        run: |-
          bun run build
          node_modules/.bin/swipt project source
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: swiplets
          path: dist
          if-no-files-found: error
      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: |-
          source .github/github.sh
          if RELEASE=$(retry gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name); then
            NOTES=$(git log --format='* %s' "$RELEASE..")
          else
            NOTES=$(git log --format='* %s')
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag -a -f nightly -m "$BUILD_NUMBER" "$GITHUB_SHA"
          retry git push -f origin refs/tags/nightly
          DRAFT=$(retry create_draft nightly-draft --prerelease --target "$GITHUB_SHA" --title "Nightly build" --notes "$NOTES" dist/*)
          if PREVIOUS=$(retry gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" --jq .url); then
            retry delete "$PREVIOUS"
          fi
          retry gh api -X PATCH "$DRAFT" -f tag_name=nightly -F draft=false > /dev/null
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          GH_TOKEN: ${{ github.token }}
  release:
    name: Release
    if: inputs.release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: nightly
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Set versions
        id: version
        run: |-
          source .github/github.sh
          COMMIT=$(git rev-parse HEAD)
          NIGHTLY=$(retry gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly")
          if [ "$(jq -r .target_commitish <<< "$NIGHTLY")" != "$COMMIT" ]; then
            echo "the nightly release is not built from the nightly tag" >&2
            exit 1
          fi
          TAG=build-$(git tag -l --format='%(contents:subject)' nightly)
          EXISTING=$(retry gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .url")
          if [ -n "$EXISTING" ]; then
            echo "$TAG already exists" >&2
            exit 1
          fi
          FEED=$(retry gh api -H 'Accept: application/octet-stream' "$(jq -r '.assets[] | select(.name == "swiplets.json") | .url' <<< "$NIGHTLY")")
          for directory in $(jq -r '.workspaces[]' package.json); do
            ID=$(jq -r '.swiplet.id // empty' "$directory/package.json")
            if [ -z "$ID" ]; then
              continue
            fi
            CODE=$(jq --arg id "$ID" 'first(.swiplets[] | select(.id == $id) | .versionCode) // empty' <<< "$FEED")
            if [ -z "$CODE" ]; then
              echo "$ID is not in the nightly release" >&2
              exit 1
            fi
            echo "$ID versionCode=$CODE"
            jq --argjson code "$CODE" '.swiplet.versionCode = $code' "$directory/package.json" > "$RUNNER_TEMP/package.json"
            mv "$RUNNER_TEMP/package.json" "$directory/package.json"
          done
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install
        run: bun install
      - name: Build
        run: |-
          bun run build
          node_modules/.bin/swipt project source
      - name: Release
        run: |-
          source .github/github.sh
          LEVEL=$(npm view @swipt/api@latest apiLevel)
          REQUIRED=$(jq -r --argjson level "$LEVEL" '.swiplets[] | select(.minimumAPILevel > $level) | "\(.id) requires API level \(.minimumAPILevel), but @swipt/api@latest has \($level)"' dist/swiplets.json)
          if [ -n "$REQUIRED" ]; then
            echo "$REQUIRED" >&2
            exit 1
          fi
          retry create_draft "$TAG" --target "$COMMIT" --notes "" dist/*
        env:
          COMMIT: ${{ steps.version.outputs.commit }}
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
